<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120D" />
      <stop offset="50%" stop-color="#0E231B" />
      <stop offset="100%" stop-color="#040C08" />
    </linearGradient>

    <!-- Forest & Geospatial Emerald-Cyan Gradient -->
    <linearGradient id="forest-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Topographic Land Survey Accent -->
    <linearGradient id="survey-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#1D3E2F" stroke-width="2" />

  <!-- Topographic Contour Map Lines & Geospatial Reticle -->
  <g opacity="0.18" stroke="#10B981" stroke-width="1.5" fill="none">
    <ellipse cx="400" cy="380" rx="250" ry="170" stroke-dasharray="8 8" />
    <ellipse cx="400" cy="380" rx="190" ry="120" stroke-dasharray="6 6" />
    <path d="M 220 280 Q 320 220, 420 280 T 580 280" />
    <path d="M 200 480 Q 340 540, 440 480 T 600 480" />
    <line x1="400" y1="100" x2="400" y2="660" stroke-dasharray="4 8" />
    <line x1="120" y1="380" x2="680" y2="380" stroke-dasharray="4 8" />
  </g>

  <!-- The Geospatial Forest Shield (Main Hero Frame) -->
  <path d="M 400 160 
           L 570 240 
           C 570 420, 480 540, 400 600 
           C 320 540, 230 420, 230 240 
           Z" 
        fill="url(#core-glow)" 
        stroke="url(#forest-grad)" 
        stroke-width="10" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Satellite Segmentation Raster Grid & Forest Canopy Tree -->
  <!-- Canopy Tree Trunk & Foliage Rings -->
  <g filter="url(#subtle-glow)">
    <!-- Tree Canopy Layers (Representing Forest Land Rights) -->
    <path d="M 400 240 L 460 320 L 430 320 L 480 390 L 420 390 L 420 480 L 380 480 L 380 390 L 320 390 L 370 320 L 340 320 Z" 
          fill="#0D2C20" 
          stroke="url(#forest-grad)" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- U-Net Semantic Pixel Grid Overlay on Right Half -->
    <g opacity="0.75" stroke="#22D3EE" stroke-width="2" fill="none">
      <rect x="420" y="320" width="30" height="30" fill="#06B6D4" opacity="0.3" />
      <rect x="450" y="320" width="30" height="30" />
      <rect x="420" y="350" width="30" height="30" />
      <rect x="450" y="350" width="30" height="30" fill="#10B981" opacity="0.4" />
      <rect x="420" y="380" width="30" height="30" fill="#F59E0B" opacity="0.3" />
      <rect x="450" y="380" width="30" height="30" />
    </g>

    <!-- PostGIS Geographic Vector Pin at Center Tree Apex -->
    <circle cx="400" cy="240" r="14" fill="#F59E0B" stroke="#F8FAFC" stroke-width="3" filter="url(#glow)" />
    <circle cx="400" cy="240" r="4" fill="#111827" />
  </g>

  <!-- Model Context Protocol (MCP) Vector Nodes -->
  <g fill="#10B981" filter="url(#subtle-glow)">
    <circle cx="280" cy="300" r="7" />
    <circle cx="520" cy="300" r="7" />
    <circle cx="310" cy="460" r="6" />
    <circle cx="490" cy="460" r="6" />
  </g>
  <g stroke="#22D3EE" stroke-width="2" stroke-dasharray="4 4" opacity="0.6">
    <line x1="280" y1="300" x2="340" y2="320" />
    <line x1="520" y1="300" x2="460" y2="320" />
    <line x1="310" y1="460" x2="380" y2="480" />
    <line x1="490" y1="460" x2="420" y2="480" />
  </g>

  <!-- Typography -->
  <text x="400" y="685" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="4">
    TECH<tspan fill="#10B981">RANGERS</tspan>
  </text>
  <text x="400" y="722" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="3">
    AI FOREST RIGHTS &amp; GEOSPATIAL DSS (MCP)
  </text>
</svg>
